<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#F5F5F0;min-height:100vh;}
.app{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;}
.header{background:#fff;border-bottom:1px solid #E8E8E4;padding:12px 16px 0;position:sticky;top:0;z-index:100;}
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.header-title{font-size:15px;font-weight:700;color:#1A1A18;}
.hbtn{background:none;border:none;cursor:pointer;font-size:20px;padding:2px;color:#888;}
.status-bar{font-size:11px;color:#3B7D1A;padding-bottom:8px;display:flex;align-items:center;gap:5px;}
.sdot{width:7px;height:7px;border-radius:50%;background:#3B7D1A;display:inline-block;flex-shrink:0;}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.maintab{flex-shrink:0;padding:8px 10px;font-size:11px;color:#888;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;}
.maintab.active{color:#1A1A18;border-bottom-color:#1A1A18;font-weight:700;}
.content{padding:14px;}
.page{display:none;}.page.active{display:block;}
.card{background:#fff;border:1px solid #E8E8E4;border-radius:12px;padding:14px;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:700;color:#1A1A18;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.fi{margin-bottom:12px;}
.fl{font-size:12px;color:#666;margin-bottom:5px;display:block;font-weight:500;}
.fi input[type=text],.fi input[type=date],.fi input[type=time],.fi input[type=number],.fi select,.fi textarea{width:100%;font-size:14px;padding:9px 11px;border:1px solid #E0E0DB;border-radius:8px;background:#fff;color:#1A1A18;-webkit-appearance:none;}
.fi textarea{resize:vertical;min-height:65px;}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:#1A1A18;}
.drow{display:flex;gap:8px;}.drow input{flex:1;}
.rg{display:flex;flex-direction:column;gap:7px;}
.ri{display:flex;align-items:center;gap:9px;font-size:14px;color:#1A1A18;cursor:pointer;padding:8px 10px;border:1px solid #E0E0DB;border-radius:8px;}
.ri input[type=radio]{width:16px;height:16px;accent-color:#1A1A18;flex-shrink:0;}
.ri.sel{border-color:#1A1A18;background:#F8F8F5;}
.cg{display:flex;gap:8px;}
.ci{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 4px;border:1px solid #E0E0DB;border-radius:8px;font-size:14px;color:#888;cursor:pointer;font-weight:500;}
.ci.sel{border-color:#1A1A18;color:#1A1A18;background:#F8F8F5;}
.tcalc{background:#F8F8F5;border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-top:7px;}
.tcalc-l{font-size:12px;color:#666;}
.tcalc-v{font-size:18px;font-weight:700;color:#1A1A18;}
.sbtn{width:100%;background:#1A1A18;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.sbtn:disabled{opacity:0.4;cursor:not-allowed;}
.ssub{font-size:12px;font-weight:600;color:#666;margin:12px 0 7px;padding-bottom:4px;border-bottom:1px solid #E8E8E4;}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:6px;}
.ci2{display:flex;flex-direction:column;gap:3px;}
.cl{font-size:11px;color:#666;font-weight:500;}
.cinp{width:100%;font-size:14px;padding:7px 9px;border:1px solid #E0E0DB;border-radius:8px;background:#fff;color:#1A1A18;}
.cinp:focus{outline:none;border-color:#1A1A18;}
.dtabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;}
.dtab{padding:5px 12px;font-size:12px;border:1px solid #E0E0DB;border-radius:20px;cursor:pointer;color:#888;background:#fff;font-weight:500;}
.dtab.active{background:#1A1A18;color:#fff;border-color:#1A1A18;}
.dpage{display:none;}.dpage.active{display:block;}
.toast{font-size:13px;padding:10px 13px;border-radius:10px;display:none;text-align:center;margin-top:8px;font-weight:500;}

.terr{background:#FDECEA;color:#B71C1C;}
